[project]
name = "gembaleap-workers"
version = "0.1.0"
description = "Scheduled and event-driven Cloud Run jobs for GembaLeap."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gembaleap_workers"]

[tool.ruff]
line-length = 100
target-version = "py312"
