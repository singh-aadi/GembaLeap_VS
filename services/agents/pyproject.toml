[project]
name = "gembaleap-agents"
version = "0.1.0"
description = "GembaLeap agent service: ADK orchestrator, specialist agents and deterministic scoring."
requires-python = ">=3.12"
dependencies = [
  "google-adk==2.12.0",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.54.0",
  "pydantic==2.14.1",
  "python-ulid==3.1.0",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "ruff==0.17.1",
  "httpx",
  "datamodel-code-generator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gembaleap_agents"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
# The formatter owns line length.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"gembaleap_agents/schemas.py" = ["I001", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
